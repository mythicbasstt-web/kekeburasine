<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Erişim Engellendi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --accent: #3b82f6; --bg: #06080f; }

    body {
      background: var(--bg);
      color: #eef2ff;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
    }

    /* Grid arka plan */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image:
        linear-gradient(rgba(59,130,246,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(59,130,246,0.04) 1px, transparent 1px);
      background-size: 48px 48px;
      pointer-events: none;
    }

    /* Glow */
    body::after {
      content: '';
      position: fixed;
      width: 500px; height: 500px;
      background: radial-gradient(circle, rgba(59,130,246,0.07) 0%, transparent 70%);
      top: 50%; left: 50%; transform: translate(-50%, -50%);
      pointer-events: none;
    }

    .container {
      position: relative; z-index: 1;
      text-align: center; padding: 40px 24px;
      max-width: 480px; width: 100%;
      animation: fadeUp 0.6s cubic-bezier(0.16,1,0.3,1) both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .icon-wrap {
      width: 80px; height: 80px; margin: 0 auto 24px;
      background: rgba(59,130,246,0.1);
      border: 1px solid rgba(59,130,246,0.25);
      border-radius: 20px;
      display: flex; align-items: center; justify-content: center;
      font-size: 2rem; color: var(--accent);
      box-shadow: 0 0 40px rgba(59,130,246,0.12);
      animation: pulse 3s ease-in-out infinite;
    }
    @keyframes pulse {
      0%,100% { box-shadow: 0 0 40px rgba(59,130,246,0.12); }
      50%     { box-shadow: 0 0 60px rgba(59,130,246,0.2); }
    }

    .code {
      font-family: 'JetBrains Mono', monospace;
      font-size: 5rem; font-weight: 900;
      color: var(--accent); line-height: 1;
      margin-bottom: 12px; letter-spacing: -0.04em;
      text-shadow: 0 0 40px rgba(59,130,246,0.3);
    }

    h1 {
      font-size: 1.4rem; font-weight: 700; margin-bottom: 10px;
      letter-spacing: -0.02em;
    }

    p {
      font-size: 0.9rem; color: rgba(255,255,255,0.45);
      line-height: 1.7; margin-bottom: 32px;
    }

    .divider {
      width: 48px; height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      margin: 0 auto 28px; border-radius: 2px;
    }

    .countdown {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem; color: rgba(255,255,255,0.3);
      margin-bottom: 20px;
    }
    .countdown span { color: var(--accent); font-weight: 700; }

    .btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 12px 28px;
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      color: #fff; border: none; border-radius: 10px;
      font-size: 0.9rem; font-weight: 700; cursor: pointer;
      text-decoration: none;
      box-shadow: 0 4px 20px rgba(59,130,246,0.35);
      transition: all 0.2s;
    }
    .btn:hover {
      background: linear-gradient(135deg, #60a5fa, #3b82f6);
      box-shadow: 0 4px 28px rgba(59,130,246,0.5);
      transform: translateY(-1px);
    }

    .particles {
      position: fixed; inset: 0; pointer-events: none; z-index: 0;
    }
  </style>
</head>
<body>

  <canvas class="particles" id="c"></canvas>

  <div class="container">
    <div class="icon-wrap"><i class="fa-solid fa-ban"></i></div>
    <div class="code">403</div>
    <h1>Erişim Engellendi</h1>
    <div class="divider"></div>
    <p>Bu sayfaya erişim yetkiniz bulunmamaktadır.<br>Hatalı şifre girdiniz veya geçersiz bir işlem gerçekleştirdiniz.</p>
    <p class="countdown">Yönlendiriliyorsunuz... <span id="c-num">5</span>s</p>
    <a href="index.html" class="btn">
      <i class="fa-solid fa-arrow-left"></i> Ana Sayfaya Dön
    </a>
  </div>

  <script>
    // Parçacık arka planı
    (function(){
      const cv = document.getElementById("c");
      const ctx = cv.getContext("2d");
      let W, H, pts = [];
      function resize(){ W = cv.width = innerWidth; H = cv.height = innerHeight; }
      resize();
      window.addEventListener("resize", resize);
      for(let i=0;i<40;i++) pts.push({
        x:Math.random()*W, y:Math.random()*H,
        vx:(Math.random()-.5)*.4, vy:(Math.random()-.5)*.4,
        r:Math.random()*1.5+.5
      });
      function loop(){
        ctx.clearRect(0,0,W,H);
        pts.forEach(p=>{
          p.x+=p.vx; p.y+=p.vy;
          if(p.x<-5||p.x>W+5) p.vx*=-1;
          if(p.y<-5||p.y>H+5) p.vy*=-1;
          ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
          ctx.fillStyle="rgba(59,130,246,0.5)"; ctx.fill();
        });
        requestAnimationFrame(loop);
      }
      loop();
    })();

    // Geri sayım
    let n = 5;
    const el = document.getElementById("c-num");
    const t = setInterval(()=>{
      n--;
      if(el) el.textContent = n;
      if(n <= 0){ clearInterval(t); window.location.href = "index.html"; }
    }, 1000);
  </script>

</body>
</html>
